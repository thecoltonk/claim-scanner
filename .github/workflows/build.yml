name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path app.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Build
        run: pyinstaller --noconfirm ClaimScanner.spec
      - name: Zip
        shell: pwsh
        run: |
          Copy-Item eclaim-prefill.user.js, README.md, LICENSE dist/ClaimScanner/
          Compress-Archive dist/ClaimScanner ClaimScanner-windows.zip
      - name: Smoke test + self-update test (in a copy, so no test data/keys end up in the zip)
        shell: pwsh
        run: |
          $t = Join-Path $env:RUNNER_TEMP "smoke"
          Copy-Item -Recurse dist/ClaimScanner $t
          $env:CLAIMSCANNER_UPDATE_ZIP = (Resolve-Path ClaimScanner-windows.zip).Path
          Start-Process (Join-Path $t "ClaimScanner.exe") -ArgumentList "--no-browser"
          $log = Join-Path $t "claim-scanner.log"
          function Ready { try { $r = Invoke-RestMethod http://127.0.0.1:5000/api/home; return ($r.rows[0][1] -like "ready*") } catch { return $false } }
          $ok = $false; for ($i = 0; $i -lt 90; $i++) { Start-Sleep 2; if (Ready) { $ok = $true; break } }
          Get-Content $log -ErrorAction SilentlyContinue
          if (-not $ok) { throw "the reader didn't load" }
          if (-not (Select-String -Path $log -Pattern "Tray icon: on" -Quiet)) { throw "the tray icon didn't start" }
          if (-not (Select-String -Path $log -Pattern "Power throttling: off" -Quiet)) { throw "couldn't turn off power throttling" }
          $tok = Get-Content (Join-Path $t "token.txt")
          Invoke-RestMethod -Method Post http://127.0.0.1:5000/api/update | Out-Null
          $back = $false; Start-Sleep 5
          for ($i = 0; $i -lt 90; $i++) { Start-Sleep 2; if ((Ready) -and (Select-String -Path $log -Pattern "Updated to" -Quiet)) { $back = $true; break } }
          Get-Content $log -Tail 15
          if (-not $back) { throw "self-update didn't restart the app" }
          if ((Get-Content (Join-Path $t "token.txt")) -ne $tok) { throw "self-update changed the user's token" }
          if (-not (Test-Path (Join-Path $t "config.py"))) { throw "self-update lost config.py" }
          Invoke-RestMethod -Method Post http://127.0.0.1:5000/api/quit | Out-Null
      - uses: actions/upload-artifact@v4
        with:
          name: ClaimScanner-windows
          path: ClaimScanner-windows.zip
      - name: Release (every passing build of main = a download, named after VERSION in app.py)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          name: Claim Scanner ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: ClaimScanner-windows.zip
